# Manual, tag-driven releases — see .claude/commands/release.md.
# `pnpm changeset` per change; a maintainer runs `pnpm version`, commits
# "release X.Y.Z" on main, then pushes tag vX.Y.Z.
#
# The skill needs no build: `npx skills add maastrich/gh-stack-tree` reads
# skills/*/SKILL.md straight from the default branch.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  browser-extension:
    name: Browser extension
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: extension } }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm compile
      - run: pnpm test
      - run: pnpm zip && pnpm zip:firefox
      - uses: actions/upload-artifact@v7
        with:
          name: browser-extension
          path: extension/.output/*.zip
          include-hidden-files: true
          if-no-files-found: error

  stores:
    name: Publish to stores
    needs: browser-extension
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: extension } }
    # Each store is gated on its own secrets; nothing is submitted until they
    # exist. Create them with `pnpm wxt submit init` (see CONTRIBUTING.md).
    env:
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
      FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
      FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
      FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
      EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with: { name: browser-extension, path: extension/.output }
      - name: Chrome Web Store
        if: env.CHROME_EXTENSION_ID != ''
        run: pnpm wxt submit --chrome-zip .output/*-chrome.zip
      - name: Firefox Add-ons
        if: env.FIREFOX_EXTENSION_ID != ''
        run: pnpm wxt submit --firefox-zip .output/*-firefox.zip --firefox-sources-zip .output/*-sources.zip
      - name: Edge Add-ons
        if: env.EDGE_PRODUCT_ID != ''
        run: pnpm wxt submit --edge-zip .output/*-chrome.zip
      - if: env.CHROME_EXTENSION_ID == '' && env.FIREFOX_EXTENSION_ID == '' && env.EDGE_PRODUCT_ID == ''
        run: echo "no store credentials configured — skipped"

  release:
    name: GitHub Release
    needs: browser-extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v8
        with: { name: browser-extension, path: dist }
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*.zip
          body: |
            ## Installation

            **gh extension**
            ```bash
            gh extension install maastrich/gh-stack-tree   # or: gh extension upgrade stack-tree
            ```

            **Browser extension** — download the chrome or firefox zip below,
            unzip, load unpacked (`chrome://extensions` → Developer mode;
            Firefox `about:debugging`), then set a GitHub token in the options.

            **Agent skill**
            ```bash
            npx skills add maastrich/gh-stack-tree
            ```

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/extension/CHANGELOG.md) for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gh-extension:
    name: gh extension binaries
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: cli/go.mod, cache-dependency-path: cli/go.sum }
      - uses: cli/gh-extension-precompile@v2
        with:
          go_version_file: cli/go.mod
          build_script_override: scripts/build-gh-extension.sh
