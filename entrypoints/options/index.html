<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>gh-stack-tree options</title>
    <style>
      body { font: 14px system-ui, sans-serif; max-width: 520px; margin: 2rem auto; padding: 0 1rem; }
      label { display: block; font-weight: 600; margin-bottom: .4rem; }
      input { width: 100%; padding: .5rem; font-family: monospace; box-sizing: border-box; }
      p.hint { color: #666; font-size: 12px; }
      #status { margin-left: .5rem; color: #1a7f37; }
    </style>
  </head>
  <body>
    <h1>gh-stack-tree</h1>
    <label for="token">GitHub token</label>
    <input id="token" type="password" placeholder="github_pat_… / ghp_…" autocomplete="off" />
    <p class="hint">
      Fine-grained PAT with <code>Pull requests: read</code> on the repos you use.
      Used to list the PRs sharing a <code>stacktree:&lt;name&gt;</code> label.
    </p>
    <button id="save">Save</button><span id="status"></span>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
